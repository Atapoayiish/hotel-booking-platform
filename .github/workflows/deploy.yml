name: Deploy Hotel Booking App
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure aws via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::858823300180:role/GitHubActionsDeployRole
          aws-region: eu-west-1
      - name: Login to ECR
        run: aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 858823300180.dkr.ecr.eu-west-1.amazonaws.com
      - name: Build and Push
        run: docker build -t 858823300180.dkr.ecr.eu-west-1.amazonaws.com/hotel-app:latest ./app && docker push 858823300180.dkr.ecr.eu-west-1.amazonaws.com/hotel-app:latest
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name hotel-eks --region eu-west-1
      - name: Deploy to EKS
        run: kubectl apply -f k8s/deployment.yaml -n production && kubectl apply -f k8s/service.yaml -n production && kubectl apply -f k8s/hpa.yaml -n production && kubectl set image deployment/hotel-app hotel-app=858823300180.dkr.ecr.eu-west-1.amazonaws.com/hotel-app:latest -n production && kubectl rollout status deployment/hotel-app -n production
